name: AndroidRuntime
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    CLANG_CXX_LANGUAGE_STANDARD: c++17
targets:
  AndroidRuntime:
    type: application
    platform: iOS
    sources:
      - path: iPadApp
      - path: Core/EmulatorCore.cpp
      - path: Core/EmulatorCore.h
      - path: iPadApp/GuestConfiguration.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.androidruntime
        INFOPLIST_FILE: iPadApp/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Android Runtime
        INFOPLIST_KEY_LSRequiresIPhoneOS: true
        SWIFT_OBJC_BRIDGING_HEADER: iPadApp/AndroidRuntime-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SUPPORTS_MACCATALYST: false
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"

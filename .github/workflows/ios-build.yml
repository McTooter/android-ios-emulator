name: iPadOS Build

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  UTM_SUBMODULE_COMMIT: 8e4de50817e76a83d6840212311627a78dd4f8b2

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project AndroidRuntime.xcodeproj \
            -scheme AndroidRuntime \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AndroidRuntime.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=

      - name: Package unsigned IPA payload
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/AndroidRuntime.xcarchive/Products/Applications/AndroidRuntime.app" "$RUNNER_TEMP/Payload/"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Payload" AndroidRuntime-unsigned-payload.zip

      - name: Upload archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AndroidRuntime-iOS-unsigned
          path: |
            ${{ runner.temp }}/AndroidRuntime.xcarchive
            AndroidRuntime-unsigned-payload.zip

  build-utm-milestone:
    name: Build UTM/QEMU iOS milestone
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout with UTM submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select the current Xcode toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Restore UTM iOS ARM64 sysroot
        id: cache-utm-sysroot
        uses: actions/cache/restore@v4
        with:
          path: vendor/UTM/sysroot-iOS-arm64
          key: utm-ios-arm64-${{ env.UTM_SUBMODULE_COMMIT }}-${{ hashFiles('vendor/UTM/scripts/build_dependencies.sh', 'vendor/UTM/patches/**', 'tools/patch_utm_meson_cross.py') }}
          restore-keys: |
            utm-ios-arm64-${{ env.UTM_SUBMODULE_COMMIT }}-

      - name: Install UTM build prerequisites
        if: steps.cache-utm-sysroot.outputs.cache-matched-key == ''
        run: |
          brew install bison pkg-config gettext glib-utils libgpg-error nasm make meson cmake
          brew install llvm libclc spirv-tools spirv-llvm-translator libxcb libxrandr
          echo "/opt/homebrew/opt/bison/bin:/usr/local/opt/bison/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix glib-utils)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix libgpg-error)/bin" >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/utm-venv"
          "$RUNNER_TEMP/utm-venv/bin/python" -m pip install --upgrade pip six pyparsing setuptools pyyaml distlib mako
          echo "$RUNNER_TEMP/utm-venv/bin" >> "$GITHUB_PATH"

      - name: Validate UTM dependency environment
        if: steps.cache-utm-sysroot.outputs.cache-matched-key == ''
        run: |
          set -euxo pipefail
          command -v python3
          python3 -c 'import six, pyparsing, setuptools, yaml, distlib, mako'
          command -v bison
          command -v msgfmt
          command -v glib-mkenums
          command -v glib-compile-resources
          command -v gpg-error-config
          command -v meson
          command -v cmake

      - name: Patch Meson iOS cross wrapper
        if: steps.cache-utm-sysroot.outputs.cache-matched-key == ''
        run: |
          python3 tools/patch_utm_meson_cross.py vendor/UTM/scripts/build_dependencies.sh
          grep -F "exe_wrapper = ['/bin/sh', '-c', 'printf 0']" vendor/UTM/scripts/build_dependencies.sh

      - name: Build UTM ARM64 dependencies
        if: steps.cache-utm-sysroot.outputs.cache-matched-key == ''
        working-directory: vendor/UTM
        run: |
          set -o pipefail
          ./scripts/build_dependencies.sh -p ios -a arm64 > "$RUNNER_TEMP/utm-dependencies.log" 2>&1 || {
            tail -n 260 "$RUNNER_TEMP/utm-dependencies.log"
            exit 1
          }

      - name: Save UTM iOS ARM64 sysroot cache
        if: steps.cache-utm-sysroot.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: vendor/UTM/sysroot-iOS-arm64
          key: utm-ios-arm64-${{ env.UTM_SUBMODULE_COMMIT }}-${{ hashFiles('vendor/UTM/scripts/build_dependencies.sh', 'vendor/UTM/patches/**', 'tools/patch_utm_meson_cross.py') }}

      - name: Build unsigned UTM iOS archive
        working-directory: vendor/UTM
        run: ./scripts/build_utm.sh -k iphoneos -s iOS -a arm64 -o "$RUNNER_TEMP/UTM"

      - name: Package UTM payload
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/UTM.xcarchive" -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/UTMPayload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/UTMPayload/"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/UTMPayload" UTM-unsigned-payload.zip

      - name: Upload UTM dependency log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UTM-dependency-log-${{ github.run_id }}
          if-no-files-found: ignore
          path: ${{ runner.temp }}/utm-dependencies.log

      - name: Upload UTM milestone
        uses: actions/upload-artifact@v4
        with:
          name: UTM-QEMU-iOS-unsigned
          path: |
            ${{ runner.temp }}/UTM.xcarchive
            UTM-unsigned-payload.zip

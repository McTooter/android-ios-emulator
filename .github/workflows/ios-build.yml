name: iPadOS Build

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

env:
  UTM_SUBMODULE_COMMIT: 8e4de50817e76a83d6840212311627a78dd4f8b2
  UTM_SYSROOT_ARTIFACT_ID: 8927678456
  UTM_SYSROOT_ARTIFACT_DIGEST: 37eedf9a42989af3e2526ddbf11c1281f12b295708c20169c46ca0063f014b0d

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project AndroidRuntime.xcodeproj \
            -scheme AndroidRuntime \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AndroidRuntime.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=

      - name: Package unsigned IPA payload
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/AndroidRuntime.xcarchive/Products/Applications/AndroidRuntime.app" "$RUNNER_TEMP/Payload/"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/Payload" AndroidRuntime-unsigned-payload.zip

      - name: Upload archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AndroidRuntime-iOS-unsigned
          path: |
            ${{ runner.temp }}/AndroidRuntime.xcarchive
            AndroidRuntime-unsigned-payload.zip

  build-utm-milestone:
    name: Build UTM/QEMU iOS milestone
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout with UTM submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select the current Xcode toolchain
        run: |
          if [ -d /Applications/Xcode_26.0.app/Contents/Developer ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer
          fi
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Restore UTM iOS ARM64 sysroot
        id: cache-utm-sysroot
        uses: actions/cache/restore@v4
        with:
          path: vendor/UTM/sysroot-iOS-arm64
          key: utm-ios-arm64-${{ env.UTM_SUBMODULE_COMMIT }}-${{ hashFiles('vendor/UTM/scripts/build_dependencies.sh', 'vendor/UTM/patches/**', 'tools/patch_utm_meson_cross.py') }}
          restore-keys: |
            utm-ios-arm64-${{ env.UTM_SUBMODULE_COMMIT }}-

      - name: Fetch matching upstream UTM sysroot
        if: steps.cache-utm-sysroot.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/utm-sysroot-download"
          gh api "repos/utmapp/UTM/actions/artifacts/${{ env.UTM_SYSROOT_ARTIFACT_ID }}/zip" \
            > "$RUNNER_TEMP/utm-sysroot-download/artifact.zip"
          printf '%s  %s\n' "${{ env.UTM_SYSROOT_ARTIFACT_DIGEST }}" \
            "$RUNNER_TEMP/utm-sysroot-download/artifact.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/utm-sysroot-download/artifact.zip" \
            -d "$RUNNER_TEMP/utm-sysroot-download/unpacked"
          tar -xzf "$RUNNER_TEMP/utm-sysroot-download/unpacked/sysroot.tgz" \
            -C vendor/UTM
          test -d vendor/UTM/sysroot-iOS-arm64
          test -f vendor/UTM/sysroot-iOS-arm64/bin/qemu-system-aarch64

      - name: Save UTM iOS ARM64 sysroot cache
        if: steps.cache-utm-sysroot.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: vendor/UTM/sysroot-iOS-arm64
          key: utm-ios-arm64-${{ env.UTM_SUBMODULE_COMMIT }}-${{ hashFiles('vendor/UTM/scripts/build_dependencies.sh', 'vendor/UTM/patches/**', 'tools/patch_utm_meson_cross.py') }}

      - name: Patch UTM asset catalog flags for current Xcode
        working-directory: vendor/UTM
        run: |
          set -euxo pipefail
          flag='ASSETCATALOG_OTHER_FLAGS = "--enable-icon-stack-fallback-generation=disabled";'
          grep -F "$flag" UTM.xcodeproj/project.pbxproj
          grep -v -F "$flag" UTM.xcodeproj/project.pbxproj > "$RUNNER_TEMP/UTM-project.pbxproj"
          mv "$RUNNER_TEMP/UTM-project.pbxproj" UTM.xcodeproj/project.pbxproj
          test "$(grep -F -c "$flag" UTM.xcodeproj/project.pbxproj || true)" -eq 0

      - name: Build unsigned UTM iOS archive
        working-directory: vendor/UTM
        run: ./scripts/build_utm.sh -k iphoneos -s iOS -a arm64 -o "$RUNNER_TEMP/UTM"

      - name: Package UTM payload
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/UTM.xcarchive" -type d -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/UTMPayload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/UTMPayload/"
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/UTMPayload" UTM-unsigned-payload.zip

      - name: Upload UTM dependency log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UTM-dependency-log-${{ github.run_id }}
          if-no-files-found: ignore
          path: ${{ runner.temp }}/utm-dependencies.log

      - name: Upload UTM milestone
        uses: actions/upload-artifact@v4
        with:
          name: UTM-QEMU-iOS-unsigned
          path: |
            ${{ runner.temp }}/UTM.xcarchive
            UTM-unsigned-payload.zip

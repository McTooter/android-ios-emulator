name: Android Test APK

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: test-apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build original test APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Inspect APK
        working-directory: .
        run: python3 tools/inspect_apk.py test-apk/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload original test APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidRuntime-test-apk
          path: test-apk/app/build/outputs/apk/debug/app-debug.apk
